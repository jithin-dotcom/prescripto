

server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # ✅ This tells Nginx to always serve index.html for React routes
  location / {
    try_files $uri /index.html;
  }

  # ✅ (Optional but recommended) - serve static assets efficiently
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
